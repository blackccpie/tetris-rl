[project]
name = "tetris-rl"
version = "0.1.0"
description = "Playing Tetris (Game Boy) with Reinforcement Learning"
authors = [{ name = "Albert Murienne" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium",
    "numpy",
    "pyboy",
    "stable-baselines3",
    "torch>=2.2",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["scripts/train_segments.sh"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
